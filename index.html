<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Snake.io Global Online</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #0d0f17; color: #fff; font-family: sans-serif; }
    #gameCanvas { display: block; width: 100vw; height: 100vh; }
    
    #ui {
      position: absolute; top: 20px; left: 20px;
      font-size: 18px; font-weight: bold; pointer-events: none;
      text-shadow: 0 0 10px rgba(0,255,200,0.5);
      display: flex; flex-direction: column; gap: 8px; z-index: 5;
    }

    #chat-container {
      position: absolute; bottom: 20px; left: 20px;
      width: 300px; height: 180px;
      display: flex; flex-direction: column; gap: 6px; z-index: 5;
    }
    #chat-messages {
      flex: 1; background: rgba(13, 15, 23, 0.7);
      border: 1px solid rgba(255,255,255,0.1); border-radius: 8px;
      padding: 8px; overflow-y: auto; font-size: 14px; display: flex; flex-direction: column; gap: 4px;
    }
    #chat-input {
      background: rgba(26, 30, 43, 0.9); border: 1px solid #00e682;
      color: #fff; padding: 8px 12px; border-radius: 6px; outline: none; font-size: 14px;
    }
  </style>
</head>
<body>

  <div id="ui">
    <div>Счёт: <span id="score">0</span></div>
    <div style="color:#00e682;">Игроков онлайн: <span id="online">1</span></div>
  </div>

  <div id="chat-container">
    <div id="chat-messages"></div>
    <input type="text" id="chat-input" placeholder="Чат (Enter отправить)..." onkeydown="handleChatKey(event)">
  </div>

  <canvas id="gameCanvas"></canvas>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('score');
    const onlineEl = document.getElementById('online');
    const chatMessages = document.getElementById('chat-messages');

    function resize() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    resize();
    window.addEventListener('resize', resize);

    const MAP_SIZE = 2500;
    const myId = 'p_' + Math.random().toString(36).substr(2, 6);
    const myColor = `hsl(${Math.floor(Math.random() * 360)}, 80%, 50%)`;

    let mouse = { x: canvas.width / 2, y: canvas.height / 2 };
    let myHead = { x: Math.random() * (MAP_SIZE - 400) + 200, y: Math.random() * (MAP_SIZE - 400) + 200 };
    let mySegments = [];
    let myScore = 0;
    let angle = 0;

    function resetSnake() {
      myHead = { x: Math.random() * (MAP_SIZE - 400) + 200, y: Math.random() * (MAP_SIZE - 400) + 200 };
      mySegments = [];
      myScore = 0;
      scoreEl.innerText = 0;
      for (let i = 0; i < 12; i++) {
        mySegments.push({ x: myHead.x - i * 10, y: myHead.y });
      }
    }
    resetSnake();

    let players = {};
    let foods = [];

    // Статичная еда для всех
    for (let i = 0; i < 200; i++) {
      foods.push({
        id: i,
        x: (i * 137) % MAP_SIZE,
        y: (i * 269) % MAP_SIZE,
        color: ['#ff4b4b', '#ffc832', '#3296ff', '#e650fa', '#00e682'][i % 5],
        size: 6
      });
    }

    window.addEventListener('mousemove', e => {
      mouse.x = e.clientX;
      mouse.y = e.clientY;
    });

    // === ОБЩИЙ ПУБЛИЧНЫЙ WEBSOCKET ДЛЯ ВСЕХ ИГРОКОВ ===
    const ws = new WebSocket('wss://free.plesk.com:8443/third-party/websocket');

    ws.onmessage = (event) => {
      try {
        const data = JSON.parse(event.data);
        if (data.type === 'state' && data.id !== myId) {
          players[data.id] = { ...data, lastSeen: Date.now() };
        } else if (data.type === 'chat') {
          addChatMessage(data.sender, data.text);
        }
      } catch (e) {}
    };

    function addChatMessage(sender, text) {
      const el = document.createElement('div');
      el.innerHTML = `<b style="color:#00e682;">${sender}:</b> ${text}`;
      chatMessages.appendChild(el);
      chatMessages.scrollTop = chatMessages.scrollHeight;
    }

    function handleChatKey(e) {
      if (e.key === 'Enter') {
        const input = document.getElementById('chat-input');
        const text = input.value.trim();
        if (text && ws.readyState === WebSocket.OPEN) {
          addChatMessage('Я', text);
          ws.send(JSON.stringify({ type: 'chat', sender: myId, text: text }));
          input.value = '';
        }
      }
    }

    // Отправка координат 20 раз в секунду
    setInterval(() => {
      if (ws.readyState === WebSocket.OPEN) {
        ws.send(JSON.stringify({
          type: 'state',
          id: myId,
          head: myHead,
          segments: mySegments,
          color: myColor,
          angle: angle
        }));
      }

      // Удаление выбывших игроков
      const now = Date.now();
      let active = 1;
      Object.keys(players).forEach(id => {
        if (now - players[id].lastSeen > 2000) {
          delete players[id];
        } else {
          active++;
        }
      });
      onlineEl.innerText = active;
    }, 50);

    // Игровой цикл
    function gameLoop() {
      const centerX = canvas.width / 2;
      const centerY = canvas.height / 2;
      angle = Math.atan2(mouse.y - centerY, mouse.x - centerX);

      myHead.x += Math.cos(angle) * 3.5;
      myHead.y += Math.sin(angle) * 3.5;

      myHead.x = Math.max(20, Math.min(MAP_SIZE - 20, myHead.x));
      myHead.y = Math.max(20, Math.min(MAP_SIZE - 20, myHead.y));

      let leader = myHead;
      for (let seg of mySegments) {
        let dx = leader.x - seg.x;
        let dy = leader.y - seg.y;
        let dist = Math.hypot(dx, dy);
        if (dist > 10) {
          seg.x += (dx / dist) * (dist - 10);
          seg.y += (dy / dist) * (dist - 10);
        }
        leader = seg;
      }

      // Поедание еды
      foods.forEach(f => {
        if (Math.hypot(myHead.x - f.x, myHead.y - f.y) < 14 + f.size) {
          f.x = Math.random() * MAP_SIZE;
          f.y = Math.random() * MAP_SIZE;
          myScore += 10;
          scoreEl.innerText = myScore;
          let last = mySegments[mySegments.length - 1];
          mySegments.push({ x: last.x, y: last.y });
        }
      });

      // Убийство при врезании в чужой хвост
      Object.values(players).forEach(other => {
        if (other.segments) {
          other.segments.forEach(seg => {
            if (Math.hypot(myHead.x - seg.x, myHead.y - seg.y) < 14) {
              resetSnake();
            }
          });
        }
      });

      // Отрисовка
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      const camX = myHead.x - canvas.width / 2;
      const camY = myHead.y - canvas.height / 2;

      ctx.save();
      ctx.translate(-camX, -camY);

      // Сетка
      ctx.strokeStyle = '#181e2e';
      ctx.lineWidth = 2;
      for (let x = 0; x < MAP_SIZE; x += 100) {
        ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, MAP_SIZE); ctx.stroke();
      }
      for (let y = 0; y < MAP_SIZE; y += 100) {
        ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(MAP_SIZE, y); ctx.stroke();
      }

      // Еда
      foods.forEach(f => {
        ctx.beginPath();
        ctx.arc(f.x, f.y, f.size, 0, Math.PI * 2);
        ctx.fillStyle = f.color;
        ctx.fill();
      });

      function drawSnake(head, segments, color, eyeAngle) {
        if (!head || !segments) return;
        for (let i = segments.length - 1; i >= 0; i--) {
          ctx.beginPath();
          ctx.arc(segments[i].x, segments[i].y, 12, 0, Math.PI * 2);
          ctx.fillStyle = color;
          ctx.fill();
        }
        ctx.beginPath();
        ctx.arc(head.x, head.y, 14, 0, Math.PI * 2);
        ctx.fillStyle = color;
        ctx.fill();

        const e1X = head.x + Math.cos(eyeAngle + 0.5) * 6;
        const e1Y = head.y + Math.sin(eyeAngle + 0.5) * 6;
        const e2X = head.x + Math.cos(eyeAngle - 0.5) * 6;
        const e2Y = head.y + Math.sin(eyeAngle - 0.5) * 6;

        ctx.fillStyle = '#fff';
        ctx.beginPath(); ctx.arc(e1X, e1Y, 3, 0, Math.PI * 2); ctx.fill();
        ctx.beginPath(); ctx.arc(e2X, e2Y, 3, 0, Math.PI * 2); ctx.fill();
      }

      // Отрисовка себя
      drawSnake(myHead, mySegments, myColor, angle);

      // Отрисовка всех остальных
      Object.values(players).forEach(p => {
        drawSnake(p.head, p.segments, p.color, p.angle);
      });

      ctx.restore();

      requestAnimationFrame(gameLoop);
    }

    gameLoop();
  </script>
</body>
</html>
