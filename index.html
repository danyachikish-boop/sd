<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Snake.io Online</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #0d0f17; color: #fff; font-family: sans-serif; }
    #gameCanvas { display: block; width: 100vw; height: 100vh; }
    
    #ui {
      position: absolute; top: 20px; left: 20px;
      font-size: 18px; font-weight: bold; pointer-events: none;
      text-shadow: 0 0 10px rgba(0,255,200,0.5);
      display: flex; flex-direction: column; gap: 8px; z-index: 5;
    }

    #chat-container {
      position: absolute; bottom: 20px; left: 20px;
      width: 300px; height: 180px;
      display: flex; flex-direction: column; gap: 6px; z-index: 5;
    }
    #chat-messages {
      flex: 1; background: rgba(13, 15, 23, 0.7);
      border: 1px solid rgba(255,255,255,0.1); border-radius: 8px;
      padding: 8px; overflow-y: auto; font-size: 14px; display: flex; flex-direction: column; gap: 4px;
    }
    #chat-input {
      background: rgba(26, 30, 43, 0.9); border: 1px solid #00e682;
      color: #fff; padding: 8px 12px; border-radius: 6px; outline: none; font-size: 14px;
    }
  </style>
  <script src="https://cdn.mqttcloud.com/mqtt.min.js"></script>
</head>
<body>

  <div id="ui">
    <div>Счёт: <span id="score">0</span></div>
    <div style="color:#00e682;">Игроков онлайн: <span id="online">1</span></div>
  </div>

  <div id="chat-container">
    <div id="chat-messages"></div>
    <input type="text" id="chat-input" placeholder="Чат (Enter отправить)..." onkeydown="handleChatKey(event)">
  </div>

  <canvas id="gameCanvas"></canvas>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('score');
    const onlineEl = document.getElementById('online');
    const chatMessages = document.getElementById('chat-messages');

    function resize() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    resize();
    window.addEventListener('resize', resize);

    const MAP_SIZE = 2500;
    const myId = 'p_' + Math.random().toString(36).substr(2, 6);
    const myColor = `hsl(${Math.floor(Math.random() * 360)}, 80%, 50%)`;

    let mouse = { x: canvas.width / 2, y: canvas.height / 2 };
    let myHead = { x: Math.random() * (MAP_SIZE - 400) + 200, y: Math.random() * (MAP_SIZE - 400) + 200 };
    let mySegments = [];
    let myScore = 0;
    let angle = 0;

    function resetSnake() {
      myHead = { x: Math.random() * (MAP_SIZE - 400) + 200, y: Math.random() * (MAP_SIZE - 400) + 200 };
      mySegments = [];
      myScore = 0;
      scoreEl.innerText = 0;
      for (let i = 0; i < 12; i++) {
        mySegments.push({ x: myHead.x - i * 10, y: myHead.y });
      }
    }
    resetSnake();

    let players = {};
    let foods = [];

    for (let i = 0; i < 200; i++) {
      foods.push({
        id: i,
        x: (i * 137) % MAP_SIZE,
        y: (i * 269) % MAP_SIZE,
        color: ['#ff4b4b', '#ffc832', '#3296ff', '#e650fa', '#00e682'][i % 5],
        size: 6
      });
    }

    window.addEventListener('mousemove', e => {
      mouse.x = e.clientX;
      mouse.y = e.clientY;
    });

    // === ПУБЛИЧНЫЙ СЕРВЕР МУЛЬТИПЛЕЕРА ===
    const client = mqtt.connect('wss://broker.emqx.io:8084/mqtt');

    client.on('connect', () => {
      client.subscribe('snake_game_global_room_xyz');
    });

    client.on('message', (topic, message) => {
      try {
        const data = JSON.parse(message.toString());
        if (data.type === 'state' && data.id !== myId) {
          players[data.id] = { ...data, lastSeen: Date.now() };
        } else if (data.type === 'chat') {
          addChatMessage(data.sender, data.text);
        }
      } catch (e) {}
    });

    function addChatMessage(sender, text) {
      const el = document.createElement('div');
      el.innerHTML = `<b style="color:#00e682;">${sender}:</b> ${text}`;
      chatMessages.appendChild(el);
      chatMessages.scrollTop = chatMessages.scrollHeight;
    }

    function handleChatKey(e) {
      if (e.key === 'Enter') {
        const input = document.getElementById('chat-input');
        const text = input.value.trim();
        if (text && client.connected) {
          addChatMessage('Я', text);
          client.publish('snake_game_global_room_xyz', JSON.stringify({ type: 'chat', sender: myId, text: text }));
          input.value = '';
        }
      }
    }

    setInterval(() => {
      if (client.connected) {
        client.publish('snake_game_global_room_xyz', JSON.stringify({
          type: 'state',
          id: myId,
          head: myHead,
          segments: mySegments,
          color: myColor,
          angle: angle
        }));
      }

      const now = Date.now();
      let active = 1;
      Object.keys(players).forEach(id => {
        if (now - players[id].lastSeen > 2000) {
          delete players[id];
        } else {
          active++;
        }
      });
