<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Snake.io Online (ntfy)</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #0d0f17; color: #fff; font-family: sans-serif; overflow: hidden; }
    #gameCanvas { display: block; }
    #ui {
      position: absolute; top: 20px; left: 20px;
      font-size: 20px; font-weight: bold; pointer-events: none;
      text-shadow: 0 0 10px rgba(0,255,200,0.5);
      display: flex; flex-direction: column; gap: 8px;
    }
    .online-count { color: #00e682; }
  </style>
</head>
<body>

  <div id="ui">
    <div>Счёт: <span id="score">0</span></div>
    <div class="online-count">Игроков онлайн: <span id="online">1</span></div>
  </div>
  <canvas id="gameCanvas"></canvas>

  <script>
    // Уникальная комната ntfy
    const NTFY_TOPIC = "snake_io_danya_room_1337";
    const NTFY_URL = `https://ntfy.sh/${NTFY_TOPIC}`;

    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('score');
    const onlineEl = document.getElementById('online');

    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    window.addEventListener('resize', () => {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    });

    const MAP_SIZE = 2500;
    const myId = 'player_' + Math.random().toString(36).substr(2, 7);
    const myColor = `hsl(${Math.floor(Math.random() * 360)}, 80%, 50%)`;

    let mouse = { x: canvas.width / 2, y: canvas.height / 2 };
    let myHead = {
      x: Math.random() * (MAP_SIZE - 400) + 200,
      y: Math.random() * (MAP_SIZE - 400) + 200
    };
    let mySegments = [];
    let myScore = 0;
    let angle = 0;

    for (let i = 0; i < 10; i++) {
      mySegments.push({ x: myHead.x - i * 10, y: myHead.y });
    }

    let players = {};
    let foods = [];

    for (let i = 0; i < 150; i++) {
      foods.push({
        id: i,
        x: Math.random() * MAP_SIZE,
        y: Math.random() * MAP_SIZE,
        color: ['#ff4b4b', '#ffc832', '#3296ff', '#e650fa', '#00e682'][Math.floor(Math.random() * 5)],
        size: Math.random() * 3 + 5
      });
    }

    window.addEventListener('mousemove', e => {
      mouse.x = e.clientX;
      mouse.y = e.clientY;
    });

    // === ПОДКЛЮЧЕНИЕ К NTFY ДЛЯ ПОЛУЧЕНИЯ ДАННЫХ ===
    const eventSource = new EventSource(`${NTFY_URL}/sse`);
    
    eventSource.onmessage = (event) => {
      try {
        const rawData = JSON.parse(event.data);
        if (rawData.message) {
          const payload = JSON.parse(rawData.message);
          if (payload.id && payload.id !== myId) {
            players[payload.id] = { ...payload, lastSeen: Date.now() };
          }
        }
      } catch (e) {}
    };

    // === ОТПРАВКА СВОИХ КООРДИНАТ (10 РАЗ В СЕКУНДУ) ===
    setInterval(() => {
      const payload = {
        id: myId,
        head: myHead,
        segments: mySegments,
        color: myColor,
        angle: angle
      };

      // Прямая отправка через fetch
      fetch(NTFY_URL, {
        method: 'POST',
        mode: 'cors',
        headers: { 'Content-Type': 'text/plain' },
        body: JSON.stringify(payload)
      }).catch(() => {});
    }, 100);

    // === ПРОВЕРКА ОНЛАЙНА И УДАЛЕНИЕ НЕАКТИВНЫХ ИГРОКОВ ===
    setInterval(() => {
      const now = Date.now();
      let activeCount = 1; // Считаем себя

      Object.keys(players).forEach(id => {
        // Если от игрока не было сообщений больше 2.5 секунд — он вышел
        if (now - players[id].lastSeen > 2500) {
          delete players[id];
        } else {
          activeCount++;
        }
      });

      onlineEl.innerText = activeCount
